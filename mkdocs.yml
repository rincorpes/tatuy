site_name: Tatuy Documentation
site_description: Documentation for the Tatuy Python-first 2D game engine.
site_url: https://rincorpes.github.io/tatuy/docs/
repo_url: https://github.com/rincorpes/tatuy
repo_name: rincorpes/tatuy
docs_dir: docs
site_dir: build/web/docs
use_directory_urls: true

exclude_docs: |
  ai/
  internals/mcp/

theme:
  name: mkdocs
  navigation_depth: 4

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

